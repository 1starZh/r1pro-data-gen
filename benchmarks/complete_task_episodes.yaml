            - match: {role: target}
              xy_radius_m: 0.04
              yaw_range_rad: 0.10
          physics:
            - match: {role: object}
              mass_scale: [0.90, 1.10]
              friction_scale: [0.90, 1.10]
              contact_offset_scale: [0.95, 1.05]

  - name: independent_multi_object_rearrangement
    cases:
      - id: three_objects_three_targets_complete
        task: rearrangement.three_objects_complete
        count: 10
        randomization:
          schema_version: scene_randomization.v1
          max_attempts: 128
          preserve_relations: true
          robot:
            xy_radius_m: 0.0
            yaw_range_rad: 0.0
          objects:
            - match: {role: object}
