# Atomic gripper verification fixture.
#
# The dynamic cube is repositioned at runtime from the two live finger-body
# poses. Its 3.5 cm size fits the 4 cm-high fingertip collision region and is
# intentionally smaller than the 6x12 cm pick-place cylinder, which reaches
# into the palm when centered at the finger joint origins.
name: gripper_fixture

world:
  gravity: [0.0, 0.0, -9.81]
  dt: 0.016667
  ground: true
  ground_size: [20.0, 20.0]
  ground_color: [0.25, 0.26, 0.28]

robot:
  asset: asset/r1pro/r1pro.usda
  init_pose: [0.0, 0.0, 0.0]
  home_joint_pos: {}

objects:
  - name: cylinder
    type: cuboid
    size: [0.035, 0.035, 0.035]
    pos: [0.5, 0.15, 1.2]
    mass: 0.03
    static_friction: 1.0
    dynamic_friction: 1.0
    friction_combine: max
    contact_offset: 0.004
    color: [0.0, 0.85, 0.0]

cameras:
  - name: main
    eye: [2.4, -3.0, 2.0]
    target: [0.0, 0.0, 0.8]
    width: 640
    height: 480
    focal_length: 30.0

contact_sensors:
  - name: left_finger1
    body: left_gripper_finger_link1
    filter: [cylinder]
  - name: left_finger2
    body: left_gripper_finger_link2
    filter: [cylinder]
  - name: right_finger1
    body: right_gripper_finger_link1
    filter: [cylinder]
  - name: right_finger2
    body: right_gripper_finger_link2
    filter: [cylinder]
