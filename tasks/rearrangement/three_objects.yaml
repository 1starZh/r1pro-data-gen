schema_version: task_spec.v2
id: rearrangement.three_objects
family: rearrangement
scene_human_verified: false
scene:
  # Generic holdout for independent multi-object rearrangement.
  # The instruction supplies the task semantics; this YAML only describes
  # movable objects, distinct goal regions, and observable contact evidence.
  name: multi_rearrangement

  world:
    gravity: [0.0, 0.0, -9.81]
    dt: 0.016667
    ground: true
    ground_size: [10.0, 8.0]
    ground_color: [0.22, 0.24, 0.27]

  robot:
    asset: asset/r1pro/r1pro.usda
    init_pose: [-3.50, -2.50, 0.0]
    home_joint_pos: {}
    navigation_footprint_radius_m: 0.25

  objects:
    - name: rearrange_red
      type: cuboid
      size: [0.08, 0.08, 0.12]
      pos: [-1.70, -1.20, 0.06]
      rigid_object: true
      capabilities: [movable, graspable]
      planning_margin: 0.03
      mass: 0.12
      static_friction: 0.80
      dynamic_friction: 0.65
      friction_combine: max
      contact_offset: 0.008
      color: [0.90, 0.10, 0.10]
    - name: rearrange_blue
      type: cuboid
      size: [0.08, 0.08, 0.12]
      pos: [-0.45, 0.10, 0.06]
      rigid_object: true
      capabilities: [movable, graspable]
      planning_margin: 0.03
      mass: 0.12
      static_friction: 0.80
      dynamic_friction: 0.65
      friction_combine: max
      contact_offset: 0.008
      color: [0.10, 0.30, 0.90]
    - name: rearrange_green
      type: cuboid
      size: [0.08, 0.08, 0.12]
      pos: [0.80, -1.30, 0.06]
      rigid_object: true
      capabilities: [movable, graspable]
      planning_margin: 0.03
      mass: 0.12
      static_friction: 0.80
      dynamic_friction: 0.65
      friction_combine: max
      contact_offset: 0.008
      color: [0.10, 0.80, 0.20]

    - name: rearrange_red_goal
      type: cuboid
      size: [0.24, 0.24, 0.01]
      pos: [2.20, 1.45, 0.005]
      kinematic: true
      collision_enabled: false
      capabilities: [contains_objects]
      color: [0.95, 0.35, 0.35]
      regions:
        - name: goal_region
          shape: cuboid
          center: [0.0, 0.0, 0.065]
          size: [0.24, 0.24, 0.14]
    - name: rearrange_blue_goal
      type: cuboid
      size: [0.24, 0.24, 0.01]
      pos: [2.80, 0.65, 0.005]
      kinematic: true
      collision_enabled: false
      capabilities: [contains_objects]
      color: [0.35, 0.50, 0.95]
      regions:
        - name: goal_region
          shape: cuboid
          center: [0.0, 0.0, 0.065]
          size: [0.24, 0.24, 0.14]
    - name: rearrange_green_goal
      type: cuboid
      size: [0.24, 0.24, 0.01]
      pos: [1.70, -0.15, 0.005]
      kinematic: true
      collision_enabled: false
      capabilities: [contains_objects]
      color: [0.35, 0.90, 0.45]
      regions:
        - name: goal_region
          shape: cuboid
          center: [0.0, 0.0, 0.065]
          size: [0.24, 0.24, 0.14]

  cameras:
    - name: main
      eye: [5.0, -6.5, 5.5]
      target: [0.0, 0.0, 0.35]
      width: 960
      height: 540
      focal_length: 26.0

  contact_sensors:
    - name: rearrange_red_left
      body: left_gripper_finger_link1
      filter: [rearrange_red]
    - name: rearrange_red_right
      body: right_gripper_finger_link1
      filter: [rearrange_red]
    - name: rearrange_blue_left
      body: left_gripper_finger_link1
      filter: [rearrange_blue]
    - name: rearrange_blue_right
      body: right_gripper_finger_link1
      filter: [rearrange_blue]
    - name: rearrange_green_left
      body: left_gripper_finger_link1
      filter: [rearrange_green]
    - name: rearrange_green_right
      body: right_gripper_finger_link1
      filter: [rearrange_green]

  collision_sensors: []
instruction: >-
  Move rearrange_red into rearrange_red_goal/goal_region, move rearrange_blue
  into rearrange_blue_goal/goal_region, and move rearrange_green into
  rearrange_green_goal/goal_region. The goals are independent; stacking and
  execution order are not required.
tags:
  - manipulation
  - primary
